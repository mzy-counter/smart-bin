            </div>
        </div>
    </section>

    <script>
        function toggleLang() {
            const lang = document.documentElement.lang === 'zh-CN' ? 'en' : 'zh-CN';
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-cn]').forEach(el => {
                el.innerText = el.getAttribute('data-' + (lang === 'zh-CN' ? 'cn' : 'en'));
            });
        }
    </script>
