<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技术架构 | 恒新绿源</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0f172a] text-slate-200">
    <nav class="p-6 flex justify-between items-center max-w-7xl mx-auto">
        <a href="index.html" class="text-emerald-400 font-bold">← <span data-cn="返回" data-en="Back">返回</span></a>
        <h2 class="text-xl font-black" data-cn="核心架构" data-en="Core Tech">核心架构</h2>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <div class="mb-16">
            <h3 class="text-2xl font-bold mb-6 text-center" data-cn="演示视频" data-en="Demo Video">演示视频</h3>
            <div class="aspect-video bg-black rounded-[2rem] overflow-hidden border border-white/10 shadow-2xl">
                <video controls class="w-full h-full">
                    <source src="sp.mp4" type="video/mp4">
                </video>
            </div>
        </div>

        <div class="grid lg:grid-cols-2 gap-12 items-center">
            <div class="glass-card p-2 rounded-[2.5rem] bg-slate-900 border border-white/5 overflow-hidden">
                <img src="aaaa.png" alt="结构图" class="w-full rounded-[2.3rem] brightness-110">
            </div>
            <div class="space-y-6">
                <div class="p-6 bg-slate-900/50 rounded-2xl border border-white/5">
                    <h4 class="text-emerald-400 font-bold" data-cn="FPGA 核心控制" data-en="FPGA Control">FPGA 核心控制</h4>
                    <p class="text-sm text-slate-400" data-cn="利用 Artix-7 并行架构，处理多路传感器反馈。" data-en="Artix-7 parallel architecture for multi-sensor feedback.">利用 Artix-7 并行架构，处理多路传感器反馈。</p>
                </div>
                <div class="p-6 bg-slate-900/50 rounded-2xl border border-white/5">
                    <h4 class="text-blue-400 font-bold" data-cn="L610 5G 物联网" data-en="L610 5G IoT">L610 5G 物联网</h4>
                    <p class="text-sm text-slate-400" data-cn="支持华为云 IoT 实时交互与远程维护。" data-en="Real-time interaction via Huawei Cloud IoT.">支持华为云 IoT 实时交互与远程维护。</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
